<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Stopwatch</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="stop-watch">
        <h1 id="display-time">00:00:00</h1>
        <div class="button">
            <img src="images/pause.png" onclick="playClickSound(); watchStop();">
            <img src="images/start.webp" onclick="playClickSound(); watchStart();">
            <img src="images/reset2.png" onclick="playClickSound(); watchReset();">
        </div>
    </div>

    <script>
let [seconds,minutes,hours] = [0,0,0];
let displayTime = document.getElementById("display-time");
let timer = null;

function stopWatch(){
    seconds++;
    if(seconds== 60){
        seconds= 0;
        minutes++;
        if(minutes==60){
            minutes = 0;
            hours++;
        }
    }

let h = hours < 10 ? "0"+ hours : hours;
let m = minutes  < 10 ? "0"+ minutes : minutes;
let s = seconds < 10 ? "0"+ seconds : seconds;




    displayTime.innerHTML = h +":" +m + ":" + s ;

}

function watchStart(){
    if(timer!== null){
        clearInterval(timer);
    }
   timer =  setInterval(stopWatch,1000);
}
function watchStop(){
    clearInterval(timer);
}
function watchReset(){
    clearInterval(timer);
    [seconds,minutes,hours] = [0,0,0];
    displayTime.innerHTML = "00:00:00";

}
function playClickSound() {
    let clickSound = new Audio("sound/mouse-click-290204.mp3"); 
    clickSound.play();
}

    </script>
</body>
</html>
